    name: Send weekly attendance notification
    business_process: BP-004
    actor: ACT-006
    application: APP-001
    description: Every Friday the system uses card scanner data to determine each employee's off-work
      days among the working days of the last week, matches them against the employee's leave requests
      (any submitted request counts as valid), and emails the employee the absent days without a leave
      request and the absent days with a valid leave request.
