  - id: UC-006
    name: Refresh annual leave entitlements
    business_process: BP-002
    actor: ACT-006
    application: APP-001
    description: 'At the start of each year the system automatically refreshes leave entitlements: it
      calculates every employee''s entitlement for each leave type as base days plus one day per N years
      of service, for the leave types the employee is eligible for. No amounts are imported. Requests
      still pending are then checked against the new entitlements.'
    complexity: HIGH
