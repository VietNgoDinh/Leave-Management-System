items:
  - id: UC-001
    name: Submit leave request
    business_process: BP-001
    actor: ACT-001
    application: APP-001
    description: An employee requests leave by choosing a leave type, the dates with a day part (All day,
      Morning, Afternoon) and the Project Manager who will confirm it, and by uploading any documents
      the leave type requires. Leave is counted on working days only. The system blocks a request with
      dates outside the allowed window, a missing required document or a leave type the employee is not
      eligible for. A request that exceeds the entitlement is accepted and flagged for manual review.
      The selected Project Manager is emailed. A Project Manager's own request is auto-confirmed, and
      a request from an employee with no project goes straight to the Line Manager.
    complexity: HIGH
    risk_level: MEDIUM
    requirements:
      - REQ-001
      - REQ-002
      - REQ-003
      - REQ-016
